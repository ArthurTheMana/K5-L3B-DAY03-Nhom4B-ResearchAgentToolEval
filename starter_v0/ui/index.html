<!DOCTYPE html>
<html lang="vi" data-openui-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Research Agent — Day 03 Lab</title>

<!-- OpenUI: React renderer + component library (no build step, loaded from CDN) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@openuidev/browser-bundle@0.2.2/dist/openui-styles.css" />
<link rel="stylesheet" href="/static/app.css" />
</head>
<body>

<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@openuidev/browser-bundle@0.2.2/dist/openui-bundle.min.js"></script>
<script type="module">
// Dynamic import: an toan hon static import khi tai file:// (CORS module).
const htmModule = (await import("https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.module.js")).default;

const { React, createRoot, Renderer, openuiChatLibrary } = window.__OpenUI;
const html = htmModule.bind(React.createElement);
const { useState, useEffect, useRef, useCallback } = React;

/* ------------------------------------------------------------------ */
/* Helpers                                                            */
/* ------------------------------------------------------------------ */

const looksLikeOpenUI = (text) => /^\s*root\s*=/m.test(text || "");

function ToolCallCard({ event }) {
    const [open, setOpen] = useState(false);
    const args = event.args || {};
    const argText = Object.keys(args).length ? JSON.stringify(args, null, 2) : "(no args)";
    const resultText = JSON.stringify(event.result, null, 2);
    return html`
      <div class="toolcard">
        <button class="toolcard-head" onClick=${() => setOpen(!open)}>
          <span class="toolcard-icon">🔧</span>
          <span class="toolcard-name">${event.name}</span>
          <span class="toolcard-hint">${open ? "hide" : "show"}</span>
        </button>
        ${open && html`
          <div class="toolcard-body">
            <div class="toolcard-label">arguments</div>
            <pre>${argText}</pre>
            <div class="toolcard-label">result</div>
            <pre>${resultText}</pre>
          </div>
        `}
      </div>
    `;
}

function Message({ msg }) {
    if (msg.role === "user") {
        return html`<div class="msg msg-user"><div class="bubble">${msg.text}</div></div>`;
    }
    if (msg.role === "assistant") {
        if (msg.openui) {
            return html`
              <div class="msg msg-assistant">
                <div class="bubble bubble-ui">
                  <${Renderer}
                    response=${msg.uiText || msg.text}
                    library=${openuiChatLibrary}
                    isStreaming=${!!msg.streaming}
                  />
                </div>
                ${msg.text && msg.uiText
                ? html`
                    <details class="raw-toggle">
                      <summary>raw text của agent</summary>
                      <div class="bubble">${msg.text}</div>
                    </details>
                  `
                : null}
              </div>
            `;
        }
        return html`
          <div class="msg msg-assistant">
            <div class="bubble">${msg.text || "(rỗng)"}</div>
          </div>
        `;
    }
    return null;
}

function App() {
    const [messages, setMessages] = useState([]);
    const [input, setInput] = useState("");
    const [busy, setBusy] = useState(false);
    const [provider, setProvider] = useState("openrouter");
    const [version, setVersion] = useState("v3");
    const [tools, setTools] = useState([]);
    const [artifactVersion, setArtifactVersion] = useState("");
    const [status, setStatus] = useState("");
    const bottomRef = useRef(null);

    useEffect(() => {
        fetch("/api/tools")
            .then((r) => r.json())
            .then((d) => setTools(d.tools || []))
            .catch(() => setTools([]));
    }, []);

    useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: "smooth" });
    }, [messages]);

    const send = useCallback(
        async (text) => {
            const question = (text ?? input).trim();
            if (!question || busy) return;
            setInput("");
            setBusy(true);
            setStatus("đang xử lý…");

            const history = messages
                .filter((m) => m.role === "user" || (m.role === "assistant" && !m.openui))
                .map((m) => ({ role: m.role, content: m.text }));
            history.push({ role: "user", content: question });

            setMessages((prev) => [
                ...prev,
                { role: "user", text: question },
                { role: "assistant", text: "", openui: false, streaming: true, toolEvents: [] },
            ]);

            const assistantIndex = messages.length + 1;
            const patch = (updater) =>
                setMessages((prev) => {
                    const next = prev.slice();
                    const target = next[assistantIndex];
                    next[assistantIndex] = updater({ ...target });
                    return next;
                });

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: history, provider, version }),
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || `HTTP ${res.status}`);
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    const frames = buffer.split("\n\n");
                    buffer = frames.pop() || "";

                    for (const frame of frames) {
                        const evLine = frame.split("\n").find((l) => l.startsWith("event: "));
                        const dataLine = frame.split("\n").find((l) => l.startsWith("data: "));
                        if (!evLine || !dataLine) continue;
                        const eventName = evLine.slice(7).trim();
                        const data = JSON.parse(dataLine.slice(6));

                        if (eventName === "start") {
                            setArtifactVersion(data.artifact_version || "");
                        } else if (eventName === "tool_call") {
                            patch((m) => ({
                                ...m,
                                toolEvents: [...(m.toolEvents || []), { name: data.name, args: data.args, result: null }],
                            }));
                        } else if (eventName === "tool_result") {
                            patch((m) => {
                                const events = [...(m.toolEvents || [])];
                                const idx = events.findIndex((e) => e.result === null);
                                if (idx >= 0) events[idx] = { ...events[idx], result: data.result };
                                else events.push({ name: data.tool, args: data.args, result: data.result });
                                return { ...m, toolEvents: events };
                            });
                        } else if (eventName === "answer") {
                            patch((m) => ({ ...m, text: data.text || m.text, streaming: false }));
                        } else if (eventName === "ui") {
                            patch((m) => ({ ...m, uiText: data.text || "", openui: true, streaming: false }));
                        } else if (eventName === "error") {
                            patch((m) => ({ ...m, text: `⚠️ ${data.message}`, streaming: false }));
                            setStatus("lỗi provider");
                        } else if (eventName === "done") {
                            setStatus(data.status || "");
                        }
                    }
                }
            } catch (err) {
                patch((m) => ({ ...m, text: `⚠️ ${err.message}`, streaming: false }));
                setStatus("lỗi");
            } finally {
                // Render OpenUI Lang nếu model trả về đúng định dạng, ngược lại hiện text.
                setMessages((prev) => {
                    const next = prev.slice();
                    const target = next[assistantIndex];
                    if (target && target.role === "assistant") {
                        next[assistantIndex] = {
                            ...target,
                            openui: !!target.uiText || looksLikeOpenUI(target.text),
                            streaming: false,
                        };
                    }
                    return next;
                });
                setBusy(false);
            }
        },
        [messages, input, busy, provider, version]
    );

    return html`
      <div class="layout">
        <aside class="side">
          <div class="side-brand">Research <span>Agent</span></div>
          <div class="side-sub">Day 03 Lab · Tool Eval</div>

          <div class="side-group">
            <label>Provider</label>
            <select value=${provider} onChange=${(e) => setProvider(e.target.value)}>
              ${["openrouter", "openai", "anthropic", "gemini", "ollama"].map(
                  (p) => html`<option value=${p} key=${p}>${p}</option>`
              )}
            </select>
          </div>

          <div class="side-group">
            <label>Version label</label>
            <input value=${version} onChange=${(e) => setVersion(e.target.value)} />
          </div>

          ${artifactVersion && html`<div class="side-artifact">${artifactVersion}</div>`}

          <button class="side-reset" onClick=${() => { setMessages([]); setStatus(""); }}>Reset chat</button>

          <div class="side-group">
            <label>Tools (${tools.length})</label>
            <div class="tool-list">
              ${tools.map(
                  (t) => html`
                    <details key=${t.name}>
                      <summary>${t.name}</summary>
                      <p>${t.description}</p>
                    </details>
                  `
              )}
            </div>
          </div>
        </aside>

        <main class="main">
          <header class="head">
            <h1>Research Agent</h1>
            <p>Chọn tool, chạy tool thật, lưu log, tối ưu prompt theo từng version.</p>
            ${status && html`<span class="head-status">${status}</span>`}
          </header>

          <div class="chat">
            ${messages.length === 0 && html`
              <div class="empty">
                <p>Thử một trong các câu mẫu:</p>
                <ul>
                  <li><button onClick=${() => send("Tin AI hôm nay có gì nổi bật?")}>Tin AI hôm nay có gì nổi bật?</button></li>
                  <li><button onClick=${() => send("Tóm tắt 5 tweet mới nhất giúp mình")}>Tóm tắt 5 tweet mới nhất giúp mình</button></li>
                  <li><button onClick=${() => send("Cho mình tổng quan trên Wikipedia về blockchain")}>Wikipedia về blockchain</button></li>
                  <li><button onClick=${() => send("Tổng hợp tin hôm nay rồi đăng lên Telegram cho tôi")}>Đăng lên Telegram (cần xác nhận)</button></li>
                  <li><button onClick=${() => send("Giải giúp mình hệ phương trình bậc hai")}>Câu ngoài phạm vi</button></li>
                </ul>
              </div>
            `}
            ${messages.map(
                (m, i) => html`
                  <${React.Fragment} key=${i}>
                    <${Message} msg=${m} />
                    ${(m.toolEvents || []).length > 0 &&
                    html`
                      <div class="msg msg-tools">
                        ${m.toolEvents.map(
                            (e, j) => html`<${ToolCallCard} key=${j} event=${e} />`
                        )}
                      </div>
                    `}
                  <//>
                `
            )}
            <div ref=${bottomRef} />
          </div>

          <div class="composer">
            <textarea
              value=${input}
              placeholder="Câu hỏi của bạn…"
              onChange=${(e) => setInput(e.target.value)}
              onKeyDown=${(e) => {
                  if (e.key === "Enter" && !e.shiftKey) {
                      e.preventDefault();
                      send();
                  }
              }}
            ></textarea>
            <button class="send" disabled=${busy} onClick=${() => send()}>
              ${busy ? "…" : "Gửi"}
            </button>
          </div>
        </main>
      </div>
    `;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
