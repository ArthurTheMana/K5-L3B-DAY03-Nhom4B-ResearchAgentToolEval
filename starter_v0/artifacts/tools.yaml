tools:
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng. DÙNG KHI yêu cầu mơ hồ, thiếu URL cụ thể, hoặc thiếu tên tài khoản mạng xã hội. KHÔNG DÙNG KHI đã có đủ thông tin để thực hiện lệnh."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây từ một tài khoản cụ thể. DÙNG KHI người dùng chỉ định rõ một tài khoản. Tham số screenname KHÔNG BAO GIỜ được chứa dấu '@' (ví dụ: dùng 'elonmusk' thay vì '@elonmusk')."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản (không có @)"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên mạng xã hội theo từ khóa. DÙNG KHI cần tìm kiếm chủ đề trên mạng xã hội nhưng không chỉ định tài khoản cụ thể. Dùng search_type='Top' cho bài đăng phổ biến nhất, 'Latest' cho bài đăng mới nhất."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin chung hoặc tin tức trên internet qua search engine. DÙNG KHI cần tìm thông tin mở rộng. Chọn topic='news' cho các sự kiện thời sự và kết hợp với timeframe (day/week/month/year). Chọn topic='general' cho các kiến thức chung. KHÔNG ĐƯA CÁC TỪ 'tin tức' HOẶC 'news' VÀO TRONG BIẾN query."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy và đọc nội dung toàn văn từ một địa chỉ URL. CHỈ DÙNG KHI có một URL chính xác (bắt đầu bằng http/https)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL đầy đủ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã thu thập được thành văn bản markdown digest. DÙNG KHI cần tổng hợp nhiều items để báo cáo."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  - name: send
    description: "Gửi hoặc đăng một đoạn văn bản (như bản tin, tweet, tin nhắn). KHÔNG BAO GIỜ được gọi tool này nếu người dùng chưa phê duyệt rõ ràng. CHỈ DÙNG KHI người dùng đã xác nhận đồng ý, và phải set tham số confirmed=true."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung cần gửi"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận. Bắt buộc phải là true khi gọi lệnh này."}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]